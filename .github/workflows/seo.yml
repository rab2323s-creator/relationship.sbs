name: SEO checks

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Use Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Noindex all result pages on main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: python scripts/noindex_result_pages.py --write

      - name: Verify result page indexability on pull requests
        if: github.event_name == 'pull_request'
        run: python scripts/noindex_result_pages.py --check

      - name: Regenerate sitemap on main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: python scripts/generate_sitemap.py --write

      - name: Test retroactive jealousy scoring
        run: node --test scripts/test_retroactive_jealousy.mjs

      - name: Test desire-context quiz model and navigation
        run: node --test scripts/test_desire_context_quiz.mjs

      - name: Test attraction reflection and navigation
        run: node --test scripts/test_attraction_reflection.mjs

      - name: Test staying-in-relationships quiz
        run: node --test scripts/test_relationship_staying_quiz.mjs

      - name: Test wrong-people quiz scoring and navigation
        run: node --test scripts/test_wrong_people_quiz.mjs

      - name: Test financial compatibility model
        run: node --test scripts/test_financial_compatibility.mjs

      - name: Test friendship reciprocity profiles and critical boundaries
        run: node --test scripts/test_friendship_reciprocity.mjs

      - name: Test marriage readiness scoring and critical overrides
        run: node --test scripts/test_marriage_readiness.mjs

      - name: Test couples dog quiz inline results, six percentages and welfare safeguards
        run: node --test scripts/test_dog_together_readiness.mjs

      - name: Test coworker romance quiz, inline results and power-imbalance safeguards
        run: node --test scripts/test_coworker_romance.mjs

      - name: Test emotional maturity quiz percentages and safety override
        run: node --test scripts/test_emotional_maturity_quiz.mjs

      - name: Test self-sabotage scoring, result UI and safety override
        run: node --test scripts/test_self_sabotage_quiz.mjs

      - name: Test move-in readiness scoring and profiles
        run: node --test scripts/test_move_in_readiness.mjs

      - name: Test breadcrumbing quiz scenarios and score model
        run: node --test scripts/test_breadcrumbing_quiz.mjs

      - name: Test stonewalling quiz scoring and safety override
        run: node --test scripts/test_stonewalling_quiz.mjs

      - name: Test long-distance two-partner quiz scoring
        run: node --test scripts/test_long_distance_quiz.mjs

      - name: Test widowhood support quiz scoring
        run: node --test scripts/test_dating_after_widowhood_quiz.mjs

      - name: Test parenthood decision quiz profiles and safety
        run: node --test scripts/test_parenthood_choice_quiz.mjs

      - name: Test catfish safety quiz scoring and critical warning overrides
        run: node --test scripts/test_catfish_safety_quiz.mjs

      - name: Smoke-test quiz question rendering and result UI
        run: node --test scripts/test_quiz_browser_runtime.mjs

      - name: Test two-player Would You Rather game and sharing
        run: node --test scripts/test_couples_rather_game.mjs

      - name: Test flirting style quiz scoring and interactive navigation
        run: node --test scripts/test_flirting_style_quiz.mjs

      - name: Test relationship readiness model and mobile quiz UI
        run: node --test scripts/test_relationship_readiness.mjs

      - name: Test crush quiz scoring, interaction and mobile markup
        run: node --test scripts/test_crush_quiz.mjs

      - name: Run static SEO audit
        run: python scripts/seo_audit.py

      - name: Commit result-page and sitemap changes
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Regenerate against the latest main; another push may have arrived
          # since this workflow checked out its original commit.
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            python scripts/noindex_result_pages.py --write
            python scripts/generate_sitemap.py --write
            if git diff --quiet -- sitemap.xml tests/ seo/indexable-result-paths.txt; then
              echo "SEO-generated files already synchronized."
              exit 0
            fi
            git add sitemap.xml tests/ seo/indexable-result-paths.txt
            git commit -m "SEO: apply noindex to quiz results and regenerate sitemap"
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Push raced with another update (attempt ${attempt}/3); retrying on latest main."
          done
          echo "SEO-generated changes could not be pushed after 3 attempts." >&2
          exit 1
