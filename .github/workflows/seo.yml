name: SEO checks

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Noindex all result pages on main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: python scripts/noindex_result_pages.py --write

      - name: Verify result page indexability on pull requests
        if: github.event_name == 'pull_request'
        run: python scripts/noindex_result_pages.py --check

      - name: Regenerate sitemap on main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: python scripts/generate_sitemap.py --write

      - name: Run static SEO audit
        run: python scripts/seo_audit.py

      - name: Commit result-page and sitemap changes
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          if git diff --quiet -- sitemap.xml tests/ seo/indexable-result-paths.txt; then
            echo "Sitemap already synchronized."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sitemap.xml tests/ seo/indexable-result-paths.txt
          git commit -m "SEO: apply noindex to quiz results and regenerate sitemap"
          git push
