<title id="title">The Hour Between Two Lamps</title><desc id="description">A tender midnight bedroom scene with two bedside lamps, a glass of water, a folded blue blanket and a partly open window. One lamp is glowing while the other is dim, reflecting two people trying to understand the same night.</desc>
