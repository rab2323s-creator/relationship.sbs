ion</text></g><g fill="#bba5a2"><circle cx="144" cy="159" r="8"/><circle cx="1041" cy="164" r="6"/><circle cx="1008" cy="383" r="9"/><circle cx="178" cy="383" r="5"/></g><path d="M600 71v32M584 87h32" stroke="#b99f98" stroke-width="4" stroke-linecap="round" opacity=".7"/></svg>