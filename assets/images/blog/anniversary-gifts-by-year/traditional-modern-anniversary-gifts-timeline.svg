<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc"><title id="title">Anniversary gifts by year timeline</title><desc id="desc">A warm editorial flat lay of paper, cotton, wood, tin, silver and gold materials with meaningful handwritten anniversary dates.</desc><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#eadfd5"/><stop offset="1" stop-color="#beaba5"/></linearGradient><filter id="s"><feDropShadow dx="0" dy="12" stdDeviation="12" flood-opacity=".18"/></filter></defs><rect width="1200" height="800" fill="url(#g)"/><rect x="0" y="575" width="1200" height="225" fill="#9b8079"/><g filter="url(#s)"><rect x="110" y="140" width="270" height="365" rx="7" fill="#fbf5e8" transform="rotate(-8 110 140)"/><path d="M152 240h190M152 275h160M152 310h200" stroke="#b49c9a" stroke-width="6"/><rect x="408" y="170" width="280" height="300" rx="6" fill="#d0c4b4"/><path d="M415 202q80 40 125 0q85-34 140 8" stroke="#eae0d0" stroke-width="26" fill="none"/><rect x="706" y="250" width="315" height="220" rx="12" fill="#9d775d"/><path d="M731 272h265v165H731z" fill="#c09a79"/><rect x="394" y="505" width="220" height="105" rx="16" fill="#8f9296"/><rect x="633" y="505" width="220" height="105" rx="16" fill="#d8d0c7"/><rect x="872" y="505" width="220" height="105" rx="16" fill="#c9a55c"/></g><text x="96" y="89" fill="#584750" font-family="Georgia,serif" font-size="43">From paper to diamond, from year one to sixty.</text><text x="128" y="678" fill="#f9e9dc" font-family="Georgia,serif" font-size="36">Choose the year. Then make it yours.</text></svg>