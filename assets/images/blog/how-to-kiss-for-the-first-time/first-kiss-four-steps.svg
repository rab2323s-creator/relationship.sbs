<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc"><title id="title">Four simple first kiss steps</title><desc id="desc">Four numbered illustrated cards: ask first, approach slowly, make a gentle short kiss, pause and check in.</desc><rect width="1200" height="560" rx="32" fill="#edf1f3"/><text x="600" y="65" font-family="Arial,sans-serif" font-size="36" fill="#28405c" font-weight="bold" text-anchor="middle">FIRST KISS: FOUR SIMPLE MOMENTS</text><g font-family="Arial,sans-serif" fill="#28405c">
<g transform="translate(35 115)"><rect width="267" height="365" rx="22" fill="#fffaf4" stroke="#d3b8a4" stroke-width="3"/><circle cx="133" cy="58" r="31" fill="#d6a185"/><text x="133" y="70" font-size="36" font-weight="bold" fill="white" text-anchor="middle">1</text><rect x="34" y="128" width="198" height="87" rx="28" fill="#daeaf0" stroke="#8ba9b9" stroke-width="3"/><text x="133" y="166" text-anchor="middle" font-size="23" font-weight="bold">Can I kiss</text><text x="133" y="193" text-anchor="middle" font-size="23" font-weight="bold">you?</text><text x="133" y="273" text-anchor="middle" font-size="25" font-weight="bold">ASK</text><text x="133" y="314" font-size="20" text-anchor="middle">Wait for a free,</text><text x="133" y="341" font-size="20" text-anchor="middle">clear yes</text></g>
<g transform="translate(323 115)"><rect width="267" height="365" rx="22" fill="#fffaf4" stroke="#d3b8a4" stroke-width="3"/><circle cx="133" cy="58" r="31" fill="#d6a185"/><text x="133" y="70" font-size="36" font-weight="bold" fill="white" text-anchor="middle">2</text><circle cx="87" cy="174" r="35" fill="#bd8f7b"/><circle cx="185" cy="174" r="35" fill="#84a0b6"/><path d="M128 173h19m-8-9 9 9-9 9" stroke="#527188" stroke-width="4" fill="none"/><text x="133" y="273" text-anchor="middle" font-size="25" font-weight="bold">APPROACH</text><text x="133" y="314" font-size="20" text-anchor="middle">Move slowly</text><text x="133" y="341" font-size="20" text-anchor="middle">and leave space</text></g>
<g transform="translate(611 115)"><rect width="267" height="365" rx="22" fill="#fffaf4" stroke="#d3b8a4" stroke-width="3"/><circle cx="133" cy="58" r="31" fill="#d6a185"/><text x="133" y="70" font-size="36" font-weight="bold" fill="white" text-anchor="middle">3</text><path d="M55 193q37-55 78-16 42-39 79 16-36 44-79 54-43-10-78-54Z" fill="#d99aa8" stroke="#b16f7f" stroke-width="4"/><path d="M84 191q49 16 98 0" fill="none" stroke="#b16f7f" stroke-width="5"/><text x="133" y="273" text-anchor="middle" font-size="25" font-weight="bold">GENTLE KISS</text><text x="133" y="314" font-size="20" text-anchor="middle">Soft and brief;</text><text x="133" y="341" font-size="20" text-anchor="middle">no rush</text></g>
<g transform="translate(899 115)"><rect width="267" height="365" rx="22" fill="#fffaf4" stroke="#d3b8a4" stroke-width="3"/><circle cx="133" cy="58" r="31" fill="#d6a185"/><text x="133" y="70" font-size="36" font-weight="bold" fill="white" text-anchor="middle">4</text><circle cx="133" cy="184" r="69" fill="#e1ecf1" stroke="#8aa7b8" stroke-width="4"/><path d="M97 184l25 24 50-51" fill="none" stroke="#548479" stroke-width="10" stroke-linejoin="round" stroke-linecap="round"/><text x="133" y="273" text-anchor="middle" font-size="25" font-weight="bold">CHECK IN</text><text x="133" y="314" font-size="20" text-anchor="middle">Pause and ask</text><text x="133" y="341" font-size="20" text-anchor="middle">if they're okay</text></g></g><text x="600" y="518" font-family="Arial,sans-serif" font-size="22" text-anchor="middle" fill="#455c72">Either person can change their mind and stop at any time.</text></svg>