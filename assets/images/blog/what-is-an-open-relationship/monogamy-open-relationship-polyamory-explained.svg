<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="690" viewBox="0 0 1200 690" role="img" aria-labelledby="t d"><title id="t">Relationship structure comparison</title><desc id="d">Three separate illustrated cards compare monogamy, an open relationship and polyamory with simple circles and connections; overlap varies by actual agreement.</desc><rect width="1200" height="690" rx="32" fill="#f2eee9"/><text x="600" y="66" font-family="Arial,sans-serif" font-size="38" font-weight="700" text-anchor="middle" fill="#273f56">THREE RELATIONSHIP STRUCTURES</text><g font-family="Arial,sans-serif" fill="#34495d"><g transform="translate(34 110)"><rect width="359" height="476" rx="23" fill="#fffaf4" stroke="#d5c3b4" stroke-width="3"/><text x="180" y="67" font-size="31" font-weight="700" text-anchor="middle">MONOGAMY</text><circle cx="111" cy="217" r="55" fill="#91a6b2"/><circle cx="249" cy="217" r="55" fill="#d2a48e"/><path d="M169 217h22" stroke="#556e81" stroke-width="12" stroke-linecap="round"/><text x="180" y="350" font-size="25" text-anchor="middle" font-weight="700">Agreed exclusivity</text><text x="180" y="394" font-size="21" text-anchor="middle">with a partner</text><text x="180" y="430" font-size="17" text-anchor="middle" fill="#64748b">Examples vary by couple</text></g><g transform="translate(419 110)"><rect width="359" height="476" rx="23" fill="#fffaf4" stroke="#d5c3b4" stroke-width="3"/><text x="180" y="67" font-size="31" font-weight="700" text-anchor="middle">OPEN</text><text x="180" y="101" font-size="27" font-weight="700" text-anchor="middle">RELATIONSHIP</text><circle cx="116" cy="216" r="47" fill="#91a6b2"/><circle cx="237" cy="216" r="47" fill="#d2a48e"/><path d="M163 216h27" stroke="#556e81" stroke-width="10"/><circle cx="84" cy="335" r="35" fill="#a2b39c"/><circle cx="276" cy="335" r="35" fill="#baa5c2"/><path d="M104 258l-13 43M250 257l18 44" stroke="#8e9eac" stroke-width="7" stroke-dasharray="12 12"/><text x="180" y="400" font-size="23" text-anchor="middle" font-weight="700">Agreed connections</text><text x="180" y="434" font-size="18" text-anchor="middle">outside a partnership</text></g><g transform="translate(804 110)"><rect width="359" height="476" rx="23" fill="#fffaf4" stroke="#d5c3b4" stroke-width="3"/><text x="180" y="67" font-size="31" font-weight="700" text-anchor="middle">POLYAMORY</text><circle cx="114" cy="217" r="48" fill="#91a6b2"/><circle cx="244" cy="217" r="48" fill="#d2a48e"/><circle cx="183" cy="344" r="48" fill="#a2b39c"/><path d="M159 217h37M142 260l18 42M215 260l-12 42" stroke="#657d89" stroke-width="9" stroke-linecap="round"/><text x="180" y="419" font-size="22" text-anchor="middle" font-weight="700">Multiple consensual</text><text x="180" y="452" font-size="20" text-anchor="middle">romantic bonds</text></g></g><text x="600" y="640" font-family="Arial,sans-serif" font-size="22" text-anchor="middle" fill="#526779">Illustrations are examples, not universal definitions. Actual agreements may overlap.</text></svg>