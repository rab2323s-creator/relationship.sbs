<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title description">
<title id="title">Secure attachment habits: a clear request and a supportive response</title>
<desc id="description">Illustrated phone conversation showing a person requesting a pause and their partner respecting it while agreeing to reconnect.</desc>
<defs>
<linearGradient id="ground" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#e9f5f4"/><stop offset="1" stop-color="#f0eafd"/></linearGradient>
<linearGradient id="mine" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#dbeafe"/><stop offset="1" stop-color="#d5e9fc"/></linearGradient>
<filter id="shadow" x="-20%" y="-30%" width="150%" height="170%"><feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#26334b" flood-opacity=".15"/></filter>
</defs>
<rect width="1200" height="630" rx="24" fill="url(#ground)"/>
<circle cx="112" cy="115" r="135" fill="#c7dfdf" opacity=".48"/>
<circle cx="1107" cy="534" r="176" fill="#ded4f4" opacity=".55"/>
<rect x="280" y="55" width="640" height="515" rx="36" fill="#ffffff" filter="url(#shadow)"/>
<rect x="307" y="80" width="586" height="465" rx="21" fill="#fafcfe"/>
<rect x="500" y="95" width="201" height="9" rx="4.5" fill="#dee6eb"/>
<text x="600" y="153" font-size="25" text-anchor="middle" fill="#28364d" font-family="Arial, sans-serif" font-weight="bold">A more secure way to communicate</text>
<rect x="347" y="190" width="440" height="112" rx="22" fill="url(#mine)"/>
<text x="376" y="238" font-size="27" fill="#20364f" font-family="Arial,sans-serif">I need a little time to think.</text>
<text x="376" y="273" font-size="27" fill="#20364f" font-family="Arial,sans-serif">Could we talk at 7?</text>
<rect x="434" y="329" width="412" height="136" rx="23" fill="#2e635f"/>
<text x="463" y="376" font-size="26" fill="#ffffff" font-family="Arial,sans-serif">Of course. Take your time.</text>
<text x="463" y="413" font-size="26" fill="#ffffff" font-family="Arial,sans-serif">I'll be here at 7.</text>
<text x="600" y="518" text-anchor="middle" font-size="23" fill="#455b6e" font-family="Arial,sans-serif">Clarity · Respect · Follow-through</text>
</svg>